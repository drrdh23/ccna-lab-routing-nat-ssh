version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
hostname R1-GNV
boot-start-marker
boot-end-marker
enable secret 5 <REDACTED>
no aaa new-model
no ip icmp rate-limit unreachable
no ip domain lookup
ip domain name leman.local
ip cef
no ipv6 cef
multilink bundle-name authenticated
username admin privilege 15 secret 5 <REDACTED>
ip tcp synwait-time 5
ip ssh version 2
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
interface GigabitEthernet0/0
 ip address 192.168.10.101 255.255.255.252
 ip nat inside
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
interface GigabitEthernet1/0
 ip address 192.168.10.97 255.255.255.252
 ip nat inside
 negotiation auto
interface GigabitEthernet2/0
 ip address dhcp
 ip nat outside
 negotiation auto
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
interface FastEthernet4/0
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet4/1
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet5/0
 no ip address
 shutdown
 speed auto
 duplex auto
interface FastEthernet5/1
 no ip address
 shutdown
 speed auto
 duplex auto
interface Serial6/0
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/1
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/2
 no ip address
 shutdown
 serial restart-delay 0
interface Serial6/3
 no ip address
 shutdown
 serial restart-delay 0
ip nat inside source list 1 interface GigabitEthernet2/0 overload
ip forward-protocol nd
no ip http server
no ip http secure-server
ip route 192.168.10.0 255.255.255.192 192.168.10.98
ip route 192.168.10.64 255.255.255.224 192.168.10.102
access-list 1 permit 192.168.10.0 0.0.0.255
control-plane
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login local
 transport input telnet ssh
end
